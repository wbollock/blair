      responses:
        "204": { description: Revoked }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: "Personal access token (`blair_pat_…`). Scopes are listed per operation as `x-scopes`."
    session:
      type: apiKey
      in: cookie
      name: __Host-blair_session
      description: "Browser session. Unsafe requests also need `X-Requested-With: blair`."
  parameters:
    ID:
      name: id
      in: path
      required: true
      schema: { type: string }
    IfMatch:
      name: If-Match
      in: header
      description: 'ETag from a previous read, e.g. "v3". Mismatch returns 412.'
      schema: { type: string }
  responses:
    BadRequest:
      description: Malformed request
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Unauthorized:
      description: Not signed in, bad credentials or bad token
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Forbidden:
      description: Not allowed (scope, role, CSRF header or account gate)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotFound:
      description: Not found (or not yours)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Conflict:
      description: Conflicts with existing data or an invariant
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    PreconditionFailed:
      description: If-Match version is stale; `current` holds the latest copy
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Validation:
      description: Validation failed; see `errors`
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          example:
            type: urn:blair:problem:validation
            title: Validation failed
            status: 422
            detail: "validation failed: title: title is required"
            errors: [{ field: title, code: required, message: title is required }]
    RateLimited:
      description: Too many attempts; see Retry-After
      headers:
        Retry-After: { schema: { type: integer } }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    Status:
      type: string
      enum: [todo, doing, waiting, done, cancelled]
    Scope:
      type: string
      enum: [tasks:read, tasks:write, tasks:delete, notes:read, notes:write, export, account:read]
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, example: "urn:blair:problem:not_found" }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        errors:
          type: array
          items: { $ref: "#/components/schemas/FieldError" }
        current: { description: Latest copy of the resource (412 only) }
    FieldError:
      type: object
      required: [field, code, message]
      properties:
        field: { type: string }
        code: { type: string }
        message: { type: string }
    NewUser:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 12, maxLength: 256, description: "At least 12 characters; common breached passwords are rejected" }
        display_name: { type: string, maxLength: 100 }
        timezone: { type: string, example: America/New_York }
    User:
      type: object
      required: [id, email, display_name, timezone, week_start, is_admin, totp_enabled, must_change_password, disabled, settings, created_at]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        display_name: { type: string }
        timezone: { type: string }
        week_start: { type: string, enum: [monday, sunday] }
        is_admin: { type: boolean }
        totp_enabled: { type: boolean }
        must_change_password: { type: boolean }
        disabled: { type: boolean }
        settings: { type: object, additionalProperties: true }
        created_at: { type: string, format: date-time }
    Me:
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          required: [recovery_codes_remaining]
          properties:
            recovery_codes_remaining: { type: integer }
    AuthStatus:
      type: object
      required: [setup_required, registration, require_2fa, authenticated, mfa_pending, user, version]
      properties:
        setup_required: { type: boolean }
        registration: { type: string, enum: [closed, invite, open] }
        require_2fa: { type: boolean }
        authenticated: { type: boolean }
        mfa_pending: { type: boolean }
        user:
          allOf: [{ $ref: "#/components/schemas/User" }]
          nullable: true
        version: { type: string }
    LoginResponse:
      type: object
      required: [mfa_required]
      properties:
        mfa_required: { type: boolean }
        user: { $ref: "#/components/schemas/User" }
    PasswordConfirm:
      type: object
      required: [password]
      properties:
        password: { type: string }
        code: { type: string, description: Current TOTP code (when 2FA is on) }
    TOTPSetup:
      type: object
      required: [secret, otpauth_uri]
      properties:
        secret: { type: string, example: JBSWY3DPEHPK3PXPJBSWY3DPEHPK3PXP }
        otpauth_uri: { type: string }
    RecoveryCodes:
      type: object
      required: [recovery_codes]
      properties:
        recovery_codes:
          type: array
          items: { type: string }
          example: [k7f3-9qzt-2mxa]
    Session:
      type: object
      required: [id, ip, user_agent, created_at, last_seen_at, expires_at, current]
      properties:
        id: { type: string, format: uuid }
        ip: { type: string }
        user_agent: { type: string }
        created_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        current: { type: boolean }
    APIToken:
      type: object
      required: [id, name, prefix, scopes, expires_at, last_used_at, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        prefix: { type: string, example: blair_pat_8fK2xQ }
        scopes: { type: array, items: { $ref: "#/components/schemas/Scope" } }
        expires_at: { type: string, format: date-time, nullable: true }
        last_used_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        token: { type: string, description: The secret. Only present in the create response. }
    ConnectedApp:
      type: object
      required: [id, name, scopes, created_at, last_used_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, description: The name the app gave when it registered. Not verified. }
        scopes: { type: array, items: { $ref: "#/components/schemas/Scope" }, description: Only tasks:read and tasks:write can be granted. }
        created_at: { type: string, format: date-time }
        last_used_at: { type: string, format: date-time, nullable: true }
    AuditEvent:
      type: object
      required: [id, kind, ip, user_agent, detail, created_at]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, example: login.success }
        ip: { type: string }
        user_agent: { type: string }
        detail: { type: object, additionalProperties: true }
        created_at: { type: string, format: date-time }
    Plan:
      type: object
      required: [date, task_ids, tasks]
      properties:
        date: { type: string, format: date }
        task_ids: { type: array, items: { type: string, format: uuid } }
        tasks: { type: array, items: { $ref: "#/components/schemas/Task" } }
    Slipping:
      type: object
      required: [task, planned_days, first_planned, last_planned]
      properties:
        task: { $ref: "#/components/schemas/Task" }
        planned_days: { type: integer, description: Past days it was planned and not finished }
        first_planned: { type: string, format: date }
        last_planned: { type: string, format: date }
    Notification:
      type: object
      required: [id, kind, task_id, task_title, text, created_at, read_at]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, example: reminder, description: "reminder or security.<audit kind>" }
        task_id: { type: string, format: uuid, nullable: true }
        task_title: { type: string, nullable: true, description: The task's current title (reminders) }
        text: { type: string, description: Message for security notifications; empty for reminders }
        created_at: { type: string, format: date-time }
        read_at: { type: string, format: date-time, nullable: true }
    Invite:
      type: object
      required: [id, email, expires_at, used_at, created_at]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, nullable: true }
        expires_at: { type: string, format: date-time }
        used_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        token: { type: string, description: Only present in the create response }
    External:
      type: object
      properties:
        external_source: { type: string, nullable: true, maxLength: 50, example: vikunja }
        external_id: { type: string, nullable: true, maxLength: 200, example: "412" }
    Column:
      type: object
      required: [id, project_id, name, status, position, wip_limit, created_at, updated_at, version]
      properties:
        id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        name: { type: string }
        status: { $ref: "#/components/schemas/Status" }
        position: { type: string, description: Fractional index; sort ascending }
        wip_limit: { type: integer, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        version: { type: integer }
    ColumnCreate:
      type: object
      required: [name, status]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 50 }
        status: { $ref: "#/components/schemas/Status" }
        wip_limit: { type: integer, minimum: 1, nullable: true }
        after_id: { type: string, format: uuid, description: Insert after this column (default last) }
    ColumnPatch:
      type: object
      properties:
        name: { type: string, maxLength: 50 }
        status: { $ref: "#/components/schemas/Status" }
        wip_limit: { type: integer, minimum: 1, nullable: true }
        after_id: { type: string, format: uuid, nullable: true, description: Reorder after this column; null = first }
    Project:
      type: object
      required: [id, name, description, color, icon, default_view, position, archived_at, external_source, external_id, created_at, updated_at, version, columns, open_tasks]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        color: { type: string }
        icon: { type: string }
        default_view: { type: string, enum: [list, board] }
        position: { type: string }
        archived_at: { type: string, format: date-time, nullable: true }
        external_source: { type: string, nullable: true }
        external_id: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        version: { type: integer }
        columns: { type: array, items: { $ref: "#/components/schemas/Column" } }
        open_tasks: { type: integer }
    ProjectCreate:
      allOf:
        - $ref: "#/components/schemas/External"
        - type: object
          required: [name]
          properties:
            id: { type: string, format: uuid }
            name: { type: string, maxLength: 100 }
            description: { type: string }
            color: { type: string }
            icon: { type: string }
            default_view: { type: string, enum: [list, board] }
            columns: { type: array, items: { $ref: "#/components/schemas/ColumnCreate" } }
            created_at: { type: string, format: date-time }
    ProjectPatch:
      allOf:
        - $ref: "#/components/schemas/External"
        - type: object
          properties:
            name: { type: string, maxLength: 100 }
            description: { type: string }
            color: { type: string }
            icon: { type: string }
            default_view: { type: string, enum: [list, board] }
            archived: { type: boolean }
            after_id: { type: string, format: uuid, nullable: true, description: Reorder after this project; null = first }
    Task:
      type: object
      required: [id, title, description, status, priority, project_id, column_id, due_date, due_time, labels, position, completed_at, deleted_at,
        external_source, external_id, created_at, updated_at, version, checklist_total, checklist_done, is_overdue, remind_at, recurrence]
      properties:
        id: { type: string, format: uuid }
        title: { type: string, description: "Inline markdown (bold, italic, code, strike, links)" }
        description: { type: string, description: GitHub-flavoured markdown }
        status: { $ref: "#/components/schemas/Status" }
        priority: { type: integer, minimum: 0, maximum: 4, description: "0 none, 1 low, 2 medium, 3 high, 4 urgent" }
        project_id: { type: string, format: uuid, nullable: true, description: null = Inbox }
        column_id: { type: string, format: uuid, nullable: true }
        due_date: { type: string, format: date, nullable: true }
        due_time: { type: string, nullable: true, example: "09:00" }
        remind_at: { type: string, format: date-time, nullable: true, description: "When to show an in-app reminder. One per task; changing it re-arms the reminder." }
        recurrence: { type: string, nullable: true, example: "FREQ=WEEKLY;BYDAY=MO", description: "Repeat rule, a subset of RFC 5545 RRULE: FREQ=DAILY|WEEKLY|MONTHLY|YEARLY, optional INTERVAL (1–365), BYDAY (weekly) and BYMONTHDAY (monthly), e.g. FREQ=WEEKLY;BYDAY=MO,TH. Marking a repeating task done logs the completion and moves it to its next date; cancelled ends the series." }
        labels: { type: array, items: { type: string, format: uuid } }
        position: { type: string }
        completed_at: { type: string, format: date-time, nullable: true }
        deleted_at: { type: string, format: date-time, nullable: true }
        external_source: { type: string, nullable: true }
        external_id: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        version: { type: integer }
        checklist_total: { type: integer }
        checklist_done: { type: integer }
        is_overdue: { type: boolean }
    TaskCreated:
      allOf:
        - $ref: "#/components/schemas/Task"
        - type: object
          properties:
            parsed: { $ref: "#/components/schemas/QuickAddResult" }
    TaskCreate:
      allOf:
        - $ref: "#/components/schemas/External"
        - type: object
          properties:
            id: { type: string, format: uuid, description: Client-generated id for idempotent retries }
            title: { type: string, maxLength: 500 }
            quick_add: { type: string, description: Quick-add text; parsed fields fill anything not given explicitly }
            description: { type: string }
            status: { $ref: "#/components/schemas/Status" }
            priority: { type: integer, minimum: 0, maximum: 4 }
            project_id: { type: string, format: uuid, nullable: true }
            project_name: { type: string, nullable: true }
            column_id: { type: string, format: uuid, nullable: true }
            column_name: { type: string, nullable: true }
            due_date: { type: string, format: date, nullable: true }
            due_time: { type: string, nullable: true }
            remind_at: { type: string, format: date-time, nullable: true }
            recurrence: { type: string, nullable: true, description: "See Task.recurrence. Without a due_date, the task starts at the rule's first date from today." }
            labels: { type: array, items: { type: string, format: uuid } }
            label_names: { type: array, items: { type: string } }
            create_missing: { type: boolean, description: Create unknown projects/labels named in the request }
            completed_at: { type: string, format: date-time, nullable: true }
            created_at: { type: string, format: date-time, nullable: true }
            context_project_id: { type: string, description: Project view the quick-add came from (resolves /column and defaults the project) }
    TaskPatch:
      allOf:
        - $ref: "#/components/schemas/External"
        - type: object
          properties:
            title: { type: string, maxLength: 500 }
            description: { type: string }
            status: { $ref: "#/components/schemas/Status" }
            priority: { type: integer, minimum: 0, maximum: 4, nullable: true }
            project_id: { type: string, format: uuid, nullable: true, description: null moves the task to the Inbox }
            project_name: { type: string, nullable: true }
            column_id: { type: string, format: uuid, nullable: true }
            column_name: { type: string, nullable: true }
            due_date: { type: string, format: date, nullable: true }
            due_time: { type: string, nullable: true }
            remind_at: { type: string, format: date-time, nullable: true, description: null removes the reminder }
            recurrence: { type: string, nullable: true, description: null stops repeating }
            labels: { type: array, items: { type: string, format: uuid }, nullable: true }
            label_names: { type: array, items: { type: string }, nullable: true }
            create_missing: { type: boolean }
            completed_at: { type: string, format: date-time, nullable: true }
    TaskPage:
      type: object
      required: [data, next_cursor]
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/Task" } }
        next_cursor: { type: string, nullable: true }
    ChecklistItem:
      type: object
      required: [id, task_id, text, done, position, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        task_id: { type: string, format: uuid }
        text: { type: string }
        done: { type: boolean }
        position: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Label:
      type: object
      required: [id, name, color, external_source, external_id, created_at, updated_at, version]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        color: { type: string }
        external_source: { type: string, nullable: true }
        external_id: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        version: { type: integer }
    LabelCreate:
      allOf:
        - $ref: "#/components/schemas/External"
        - type: object
          required: [name]
          properties:
            id: { type: string, format: uuid }
            name: { type: string, maxLength: 50, description: No spaces }
            color: { type: string }
    Note:
      type: object
      required: [id, title, body, pinned, project_id, deleted_at, external_source, external_id, created_at, updated_at, version]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        body: { type: string, description: GitHub-flavoured markdown }
        pinned: { type: boolean }
        project_id: { type: string, format: uuid, nullable: true }
        deleted_at: { type: string, format: date-time, nullable: true }
        external_source: { type: string, nullable: true }
        external_id: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        version: { type: integer }
    NoteCreate:
      allOf:
        - $ref: "#/components/schemas/External"
        - type: object
          properties:
            id: { type: string, format: uuid }
            title: { type: string, maxLength: 500 }
            body: { type: string }
            pinned: { type: boolean }
            project_id: { type: string, format: uuid, nullable: true }
            created_at: { type: string, format: date-time, nullable: true }
    NotePatch:
      allOf:
        - $ref: "#/components/schemas/External"
        - type: object
          properties:
            title: { type: string, maxLength: 500 }
            body: { type: string }
            pinned: { type: boolean }
            project_id: { type: string, format: uuid, nullable: true }
    SearchHit:
      type: object
      required: [kind, id, title, snippet]
      properties:
        kind: { type: string, enum: [task, note] }
        id: { type: string, format: uuid }
        title: { type: string }
        snippet: { type: string }
    QuickAddToken:
      type: object
      required: [kind, text, start, end, value]
      properties:
        kind: { type: string, enum: [project, column, label, priority, date, repeat] }
        text: { type: string }
        start: { type: integer, description: Byte offset into the input }
        end: { type: integer }
        value: { type: string }
    QuickAddResult:
      type: object
      required: [title, tokens]
      properties:
        title: { type: string }
        project: { type: string }
        project_new: { type: string, description: Unknown project name (needs create_missing) }
        column: { type: string }
        column_new: { type: string, description: "/column for a project_new; resolved once that project is created" }
        priority: { type: integer }
        due_date: { type: string, format: date }
        due_time: { type: string }
        recurrence: { type: string, description: Canonical repeat rule from an "every …" phrase }
        labels: { type: array, items: { type: string } }
        labels_new: { type: array, items: { type: string } }
        tokens: { type: array, items: { $ref: "#/components/schemas/QuickAddToken" } }
    BatchOp:
      type: object
      required: [op, type]
      properties:
        op: { type: string, enum: [create, upsert, update, delete] }
        type: { type: string, enum: [project, column, label, task, note] }
        ref: { type: string, description: Name this op so later ops can reference its id }
        id: { type: string, format: uuid, description: Target for update/delete }
        data: { type: object, description: "Same fields as the matching create/PATCH body, plus project_ref/column_ref" }
    BatchResult:
      type: object
      required: [index, op, type, status]
      properties:
        index: { type: integer }
        op: { type: string }
        type: { type: string }
        ref: { type: string }
        id: { type: string, format: uuid }
        status: { type: string, enum: [created, updated, unchanged, deleted, error] }
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            fields: { type: array, items: { $ref: "#/components/schemas/FieldError" } }
    BatchResponse:
      type: object
      required: [dry_run, committed, results]
      properties:
        dry_run: { type: boolean }
        committed: { type: boolean }
        results: { type: array, items: { $ref: "#/components/schemas/BatchResult" } }
    Export:
      type: object
      required: [format, exported_at, user, projects, labels, tasks, notes]
      properties:
        format: { type: string, enum: [blair.export.v1] }
        exported_at: { type: string, format: date-time }
        user: { type: object, additionalProperties: true }
        projects: { type: array, items: { $ref: "#/components/schemas/Project" } }
        labels: { type: array, items: { $ref: "#/components/schemas/Label" } }
        tasks:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/Task"
              - type: object
                required: [checklist]
                properties:
                  checklist: { type: array, items: { $ref: "#/components/schemas/ChecklistItem" } }
        notes: { type: array, items: { $ref: "#/components/schemas/Note" } }
