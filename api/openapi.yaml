      summary: Export your whole account
      description: "`json` is `blair.export.v1` (everything, including completed and trashed). `csv` is one row per task."
      x-scopes: [export]
      parameters:
        - { name: format, in: query, schema: { type: string, enum: [json, csv], default: json } }
