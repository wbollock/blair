openapi: 3.0.3
info:
  title: Blair API
  version: "1.0.0"
  description: |
    Blair is a self-hosted task and notes app. The web app is one client of
    this API; scripts, agents, and future native apps use the same endpoints.

    ## Getting started

    1. In Blair, open **Settings → API tokens** and create a token with the
       scopes you need. It is shown once and looks like `blair_pat_…`.
    2. Send it as a bearer token:

    ```sh
    curl -H "Authorization: Bearer $BLAIR_TOKEN" https://blair.example.com/api/v1/tasks?inbox=true
    ```

    3. Create a task with the same quick-add syntax as the app:

    ```sh
    curl -X POST -H "Authorization: Bearer $BLAIR_TOKEN" -H 'Content-Type: application/json' \
      -d '{"quick_add":"Fix gutter #homelab !high fri at 9am @house"}' \
      https://blair.example.com/api/v1/tasks
    ```

    ## Conventions

    - JSON only, `snake_case`, UTC RFC 3339 timestamps. `due_date`/`due_time`
      are local to the user's timezone.
    - **PATCH** uses JSON Merge Patch: omitted = unchanged, `null` = clear.
    - Unknown request fields are rejected (`400 invalid_json`), so typos fail loudly.
    - Errors are RFC 9457 `application/problem+json` with a stable `type`
      (`urn:blair:problem:<code>`) and, for validation, per-field `errors`.
    - Single resources carry `ETag: "v<version>"`. Send `If-Match` on PATCH to
      avoid overwriting someone else's change (`412` returns the current copy).
    - Creates accept a client-generated UUID `id`. Re-sending the same create
      returns `200` with the existing resource, so retries are safe.
    - Lists return `{ "data": [...] }`; task lists are paginated with
      `next_cursor`.
    - Cookie-authenticated (browser) unsafe requests must send
      `X-Requested-With: blair`. Bearer requests don't need it.

    ## Kanban columns and status

    Each project has ordered columns; each column maps to a status
    (`todo`, `doing`, `waiting`, `done`, `cancelled`). Moving a task to a column
    sets its status. Setting a status moves the task to the first column with
    that status (or keeps its column if none matches). Inbox tasks
    (`project_id: null`) have no column.

    ## Migrating into Blair (for scripts and agents)

    There are no built-in importers. Use `POST /batch`:

    1. Export from the source app.
    2. Map each record to a Blair op. Use `upsert` with
       `external_source` + `external_id` (e.g. `vikunja` / `412`) so re-runs
       update instead of duplicating.
    3. Send `?dry_run=true` first and fix any per-op `error`.
    4. Send for real. It is one transaction, so it is all-or-nothing.
    5. Verify with `GET /tasks?external_source=vikunja`.

    History is writable: `created_at`, `status`, and `completed_at` are kept as
    given. Ops can reference earlier ops with `ref` / `project_ref` /
    `column_ref`, and tasks accept `project_name`, `column_name` and
    `label_names` (+ `create_missing: true`).

    | Source | Status mapping | Priority mapping |
    |---|---|---|
    | Vikunja | `done: true` → `done`; done bucket → done column | 1–5 → 1,1,2,3,4 |
    | tududi | not_started→todo, in_progress→doing, waiting→waiting, done/archived→done, cancelled→cancelled | low/medium/high → 1/2/3 |
    | Todoist | checked → done | p4..p1 → 0..3 (inverted) |
    | TickTick | status 2 → done, -1 → cancelled | 0/1/3/5 → 0/1/2/3 |
    | Obsidian Tasks | `[x]` → done (`✅ date` → completed_at) | ⏬🔽🔼⏫🔺 → 0/1/2/3/4 |
servers:
  - url: /api/v1
tags:
  - name: Auth
    description: Sign-in, setup and registration. Browser sessions use an HttpOnly cookie.
  - name: Account
    description: Your profile, password, 2FA, sessions, API tokens and audit log. Browser session only (except `GET /me`).
  - name: Projects
  - name: Tasks
  - name: Labels
  - name: Notes
  - name: Plans
    description: |
      Optional daily plan: the tasks you picked to work on each day, separate from due dates.
      Days are kept, so `GET /plans/slipping` can show tasks you keep planning but don't finish.
      Use `today` for the date to mean today in your account's timezone. Scripts can record a
      standup this way: `POST /plans/today/tasks {"task_ids": [...]}`.
  - name: Bulk
    description: Batch writes and export for migrations and backups.
  - name: Admin
    description: User and invite management. Admin browser session only; tokens are never accepted.
security:
  - bearer: []
  - session: []
paths:
  /auth/status:
    get:
      tags: [Auth]
      operationId: authStatus
      summary: Session and setup status
      description: Public. Tells the client whether setup is needed and who is signed in.
      security: []
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthStatus" }
  /auth/setup:
    post:
      tags: [Auth]
      operationId: setup
      summary: Create the first (admin) account
      description: Uses the one-time token the server logs on first start. Signs the new admin in.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/NewUser"
                - type: object
                  required: [token]
                  properties:
                    token: { type: string }
      responses:
        "201":
          description: Admin created and signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Validation" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /auth/register:
    post:
      tags: [Auth]
      operationId: register
      summary: Register with an invite (or openly, if enabled)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/NewUser"
                - type: object
                  properties:
                    invite_token: { type: string }
      responses:
        "201":
          description: Account created and signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Validation" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Sign in with email and password
      description: |
        If 2FA is on, the response is `{"mfa_required": true}` with a 5-minute
        pre-auth cookie; finish with `POST /auth/login/mfa`. Errors never reveal
        whether an email exists. Rate limited per IP and per account.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        "200":
          description: Signed in, or second factor required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /auth/login/mfa:
    post:
      tags: [Auth]
      operationId: loginMFA
      summary: Finish sign-in with a TOTP or recovery code
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code: { type: string, example: "123456" }
                recovery_code: { type: string, example: "k7f3-9qzt-2mxa" }
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Sign out this browser session
      responses:
        "204": { description: Signed out }
  /me:
    get:
      tags: [Account]
      operationId: getMe
      summary: Your profile
      x-scopes: [account:read]
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    patch:
      tags: [Account]
      operationId: patchMe
      summary: Update profile and settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                display_name: { type: string, maxLength: 100 }
                timezone: { type: string, example: America/New_York }
                week_start: { type: string, enum: [monday, sunday] }
                settings: { type: object, additionalProperties: true, description: "Client settings (theme, default view…), max 8 KB" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "422": { $ref: "#/components/responses/Validation" }
    delete:
      tags: [Account]
      operationId: deleteMe
      summary: Delete your account and all data
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordConfirm" }
      responses:
        "204": { description: Deleted }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Validation" }
  /me/password:
    post:
      tags: [Account]
      operationId: changePassword
      summary: Change password (signs out other sessions)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: { type: string }
                new_password: { type: string, minLength: 12, maxLength: 256 }
      responses:
        "204": { description: Changed }
        "422": { $ref: "#/components/responses/Validation" }
  /me/2fa/totp:
    post:
      tags: [Account]
      operationId: beginTOTP
      summary: Start TOTP enrollment
      description: Returns a secret and `otpauth://` URI for a QR code. 2FA is not on until confirmed.
      responses:
        "200":
          description: Enrollment secret
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TOTPSetup" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [Account]
      operationId: disableTOTP
      summary: Turn off 2FA
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordConfirm" }
      responses:
        "204": { description: 2FA off }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Validation" }
  /me/2fa/totp/confirm:
    post:
      tags: [Account]
      operationId: confirmTOTP
      summary: Confirm enrollment with a code; returns recovery codes (shown once)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, example: "123456" }
      responses:
        "200":
          description: 2FA on
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecoveryCodes" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Validation" }
  /me/2fa/recovery-codes:
    post:
      tags: [Account]
      operationId: regenerateRecoveryCodes
      summary: Replace recovery codes (old ones stop working)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string }
      responses:
        "200":
          description: New codes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecoveryCodes" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Validation" }
  /me/sessions:
    get:
      tags: [Account]
      operationId: listSessions
      summary: Signed-in browser sessions
      responses:
        "200":
          description: Sessions
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Session" } }
    delete:
      tags: [Account]
      operationId: revokeOtherSessions
      summary: Sign out everywhere else
      responses:
        "204": { description: Done }
  /me/sessions/{id}:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    delete:
      tags: [Account]
      operationId: deleteSession
      summary: Revoke one session
      responses:
        "204": { description: Revoked }
        "404": { $ref: "#/components/responses/NotFound" }
  /me/tokens:
    get:
      tags: [Account]
      operationId: listTokens
      summary: Personal access tokens
      responses:
        "200":
          description: Tokens (secrets are never shown again)
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/APIToken" } }
    post:
      tags: [Account]
      operationId: createToken
      summary: Create a token (the secret is in the response once)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, scopes]
              properties:
                name: { type: string, maxLength: 100, example: migration agent }
                scopes:
                  type: array
                  items: { $ref: "#/components/schemas/Scope" }
                  example: [tasks:read, tasks:write]
                expires_at: { type: string, format: date-time, nullable: true }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/APIToken" }
        "422": { $ref: "#/components/responses/Validation" }
  /me/tokens/{id}:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    delete:
      tags: [Account]
      operationId: deleteToken
      summary: Revoke a token
      responses:
        "204": { description: Revoked }
        "404": { $ref: "#/components/responses/NotFound" }
  /me/connected-apps:
    get:
      tags: [Account]
      operationId: listConnectedApps
      summary: Apps connected through OAuth (the MCP connector)
      description: Browser session only. Each entry is one consent you gave; revoke it to cut the app off at once.
      responses:
        "200":
          description: Connected apps, newest first
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/ConnectedApp" } }
  /me/connected-apps/{id}:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    delete:
      tags: [Account]
      operationId: revokeConnectedApp
      summary: Disconnect an app (its access and refresh tokens stop working immediately)
      responses:
        "204": { description: Disconnected }
        "404": { $ref: "#/components/responses/NotFound" }
  /me/audit:
    get:
      tags: [Account]
      operationId: listAudit
      summary: Security events for your account (latest 100)
      responses:
        "200":
          description: Events
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/AuditEvent" } }

  /notifications:
    get:
      tags: [Account]
      operationId: listNotifications
      summary: In-app notifications, newest first
      description: |
        Reminders that fired (`kind: reminder`, with the task's current title) and security
        events (`kind: security.*`: a sign-in from a new browser, a failed 2FA check after a
        correct password, password or 2FA changes, new API tokens). The app polls this.
      x-scopes: [account:read]
      parameters:
        - { name: unread, in: query, schema: { type: boolean }, description: Only unread notifications }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        "200":
          description: Notifications
          content:
            application/json:
              schema:
                type: object
                required: [data, unread_count]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Notification" } }
                  unread_count: { type: integer }
  /me/notifications/read:
    post:
      tags: [Account]
      operationId: readNotifications
      summary: Mark notifications read (all of them when ids is empty)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                ids: { type: array, maxItems: 500, items: { type: string, format: uuid } }
      responses:
        "204": { description: Marked read }

  /projects:
    get:
      tags: [Projects]
      operationId: listProjects
      summary: List projects with their columns
      x-scopes: [tasks:read]
      parameters:
        - { name: include_archived, in: query, schema: { type: boolean } }
      responses:
        "200":
          description: Projects in sidebar order
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Project" } }
    post:
      tags: [Projects]
      operationId: createProject
      summary: Create a project
      description: Without `columns`, the project gets To do / Doing / Done. Custom columns need at least one `todo` and one `done`.
      x-scopes: [tasks:write]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectCreate" }
            example: { name: Homelab, color: "#2E9E6A" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Validation" }
  /projects/{id}:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    get:
      tags: [Projects]
      operationId: getProject
      summary: Get a project
      x-scopes: [tasks:read]
      responses:
        "200":
          description: Project
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Projects]
      operationId: patchProject
      summary: Update, archive or reorder a project
      x-scopes: [tasks:write]
      parameters: [{ $ref: "#/components/parameters/IfMatch" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectPatch" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "404": { $ref: "#/components/responses/NotFound" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }
        "422": { $ref: "#/components/responses/Validation" }
    delete:
      tags: [Projects]
      operationId: deleteProject
      summary: Delete a project and its tasks (notes are kept, unlinked)
      x-scopes: [tasks:delete]
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/NotFound" }
  /projects/{id}/columns:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    post:
      tags: [Projects]
      operationId: createColumn
      summary: Add a kanban column
      x-scopes: [tasks:write]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ColumnCreate" }
            example: { name: Waiting on someone, status: waiting }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Column" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Validation" }
  /columns/{id}:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    patch:
      tags: [Projects]
      operationId: patchColumn
      summary: Rename, re-status, limit or reorder a column
      description: Changing a column's status changes the status of every task in it.
      x-scopes: [tasks:write]
      parameters: [{ $ref: "#/components/parameters/IfMatch" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ColumnPatch" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Column" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }
        "422": { $ref: "#/components/responses/Validation" }
    delete:
      tags: [Projects]
      operationId: deleteColumn
      summary: Delete a column
      description: A column with tasks needs `move_tasks_to`. The last `todo` or `done` column can't be deleted (409).
      x-scopes: [tasks:delete]
      parameters:
        - { name: move_tasks_to, in: query, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Validation" }

  /tasks:
    get:
      tags: [Tasks]
      operationId: listTasks
      summary: List and filter tasks
      description: |
        Common views:
        - Inbox: `inbox=true&status=todo,doing,waiting`
        - Today: `due_to=<today>&status=todo,doing,waiting&sort=due`
        - Logbook: `status=done,cancelled&sort=completed`
        - Trash: `deleted=true`
        - Recently added: `created_since=<7 days ago>&sort=created`
      x-scopes: [tasks:read]
      parameters:
        - { name: inbox, in: query, schema: { type: boolean }, description: Only tasks without a project }
        - { name: project_id, in: query, schema: { type: string, format: uuid } }
        - { name: column_id, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { type: string }, description: Comma-separated statuses, example: "todo,doing" }
        - { name: label_id, in: query, schema: { type: string, format: uuid } }
        - { name: due_from, in: query, schema: { type: string, format: date } }
        - { name: due_to, in: query, schema: { type: string, format: date } }
        - { name: has_due, in: query, schema: { type: boolean } }
        - { name: overdue, in: query, schema: { type: boolean } }
        - { name: q, in: query, schema: { type: string }, description: Full-text search over title and description }
        - { name: deleted, in: query, schema: { type: boolean }, description: Trash instead of live tasks }
        - { name: created_since, in: query, schema: { type: string, format: date-time } }
        - { name: updated_since, in: query, schema: { type: string, format: date-time } }
        - { name: external_source, in: query, schema: { type: string } }
        - { name: sort, in: query, schema: { type: string, enum: [position, due, priority, created, updated, completed] } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000, default: 200 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        "200":
          description: A page of tasks
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskPage" }
        "422": { $ref: "#/components/responses/Validation" }
    post:
      tags: [Tasks]
      operationId: createTask
      summary: Create a task (optionally from quick-add text)
      description: |
        `quick_add` uses the app's syntax: `#project`, `/column`, `@label`,
        `!1`–`!4` / `!high`, and natural dates (`tomorrow`, `fri at 9am`,
        `in 3 days`, `2027-06-03`). Explicit fields override parsed ones.
        Unknown project or label names fail with 422 unless
        `create_missing: true`. The response includes `parsed` tokens.
      x-scopes: [tasks:write]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaskCreate" }
            examples:
              quickAdd:
                summary: Quick-add text
