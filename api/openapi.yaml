  /batch:
    post:
      tags: [Bulk]
      operationId: batch
      summary: Apply up to 1000 create/upsert/update/delete ops in one transaction
      description: |
        All ops succeed or none are kept. A failed batch returns 422 with
        per-op `error`s (other ops show their would-be result). Use
        `?dry_run=true` to validate without writing.

        Types: `project`, `column`, `label`, `task`, `note`. `data` is the same
        object as the matching create/PATCH endpoint, plus:
        - `project_ref` / `column_ref`: the `ref` of an earlier op
        - `upsert`: matches on `data.external_source` + `data.external_id`

        Note ops also need the `notes:write` scope.
      x-scopes: [tasks:write]
      parameters:
        - { name: dry_run, in: query, schema: { type: boolean } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ops]
              properties:
                ops:
                  type: array
                  minItems: 1
                  maxItems: 1000
                  items: { $ref: "#/components/schemas/BatchOp" }
            example:
              ops:
                - { op: upsert, type: project, ref: p1, data: { name: Homelab, external_source: vikunja, external_id: "3" } }
                - op: upsert
                  type: task
                  data:
                    title: Back up caddy/data
                    project_ref: p1
                    status: done
                    created_at: "2025-01-01T08:00:00Z"
                    completed_at: "2025-03-01T12:00:00Z"
                    label_names: [ops]
                    create_missing: true
                    external_source: vikunja
                    external_id: "412"
      responses:
        "200":
          description: Applied (or validated, for dry runs)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BatchResponse" }
        "422":
          description: At least one op failed; nothing was written
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BatchResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
